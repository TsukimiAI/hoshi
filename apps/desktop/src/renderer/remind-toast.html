<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>日程提醒</title>
  <style>
    :root { --hoshi-font: system-ui; --bubble-bg: #ffffff; --bubble-ink: #1f2538; }
    html, body { margin: 0; height: 100%; background: transparent; }
    #wrap {
      box-sizing: border-box;
      height: 100%;
      padding: 8px 8px 8px 14px;
    }
    #card {
      box-sizing: border-box;
      height: 100%;
      padding: 12px 32px 12px 14px;
      border-radius: 16px;
      background: var(--bubble-bg);
      color: var(--bubble-ink);
      font: 13px/1.45 var(--hoshi-font), -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 10px 28px rgba(40, 48, 72, 0.22);
      position: relative;
    }
    #card::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 18px;
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-right: 8px solid var(--bubble-bg);
    }
    #close {
      position: absolute; right: 6px; top: 6px; border: none; background: transparent;
      color: #8e8e93; width: 22px; height: 22px; border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    #body {
      font-size: 13px; font-weight: 600;
      overflow: auto;
      max-height: 100%;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="card">
      <button id="close" type="button" aria-label="关闭">×</button>
      <div id="body"></div>
    </div>
  </div>
  <script>
    var api = window.hoshiRemind;
    var body = document.getElementById("body");
    var closeBtn = document.getElementById("close");
    function applyTokens(tokens) {
      if (!tokens) return;
      var root = document.documentElement;
      if (tokens.font) root.style.setProperty("--hoshi-font", tokens.font);
      if (tokens.menu) root.style.setProperty("--bubble-bg", tokens.menu);
    }
    if (api) {
      api.onPayload(function (payload) {
        body.textContent = payload.body || "";
        applyTokens(payload.tokens);
      });
      closeBtn.addEventListener("click", function () {
        void api.close();
      });
    }
  </script>
</body>
</html>
